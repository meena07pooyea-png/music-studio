services:
  - type: web
    name: music-studio
    runtime: node
    plan: starter
    rootDir: msinspect
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/musicstudio.sqlite
    disk:
      name: musicstudio-data
      mountPath: /var/data
      sizeGB: 1
